name: APK Android

# Se lance à chaque envoi sur main, ou à la main depuis l'onglet Actions.
# Résultat : l'APK de test (signé avec la clé de debug) est dans « Artifacts » en bas de la page du run.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Compiler l'APK de test
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Nommer l'APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/pacedrop.apk
      - uses: actions/upload-artifact@v4
        with:
          name: pacedrop-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # L'APK est aussi publié dans « Releases » (tag apk-latest, remplacé à chaque compilation) :
      # c'est le téléchargement le plus simple depuis un téléphone.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: APK de test PaceDrop
          body: "Dernière compilation de l'APK de test (signé avec la clé de debug). Télécharge « pacedrop.apk » ci-dessous."
          prerelease: true
          files: android/app/build/outputs/apk/debug/pacedrop.apk
          fail_on_unmatched_files: true
